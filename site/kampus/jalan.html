<script>

// ---------- math ----------
const M4={
 mul(a,b){const o=new Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o},

 trs(p,r,s){const [x,y,z]=p,[rx,ry,rz]=r||[0,0,0],[sx,sy,sz]=s||[1,1,1];const cy=Math.cos(ry),sy_=Math.sin(ry),cx=Math.cos(rx),sx_=Math.sin(rx),cz=Math.cos(rz),sz_=Math.sin(rz);
  return [(cy*cz+sy_*sx_*sz_)*sx,(cx*sz_)*sx,(-sy_*cz+cy*sx_*sz_)*sx,0,(-cy*sz_+sy_*sx_*cz)*sy,(cx*cz)*sy,(sy_*sz_+cy*sx_*cz)*sy,0,(sy_*cx)*sz,(-sx_)*sz,(cy*cx)*sz,0,x,y,z,1]}

const P=prog(`#version 300 es

precision highp float; in vec3 vW; in vec4 vL; in vec2 vUV;

precision mediump float; out vec4 o; void main(){o=vec4(1.);}`);
const PS=prog(`#version 300 es
in vec3 p; out float y; void main(){y=p.y*.5+.5; gl_Position=vec4(p.xy,.9999,1.);}`,`#version 300 es
precision highp float; in float y; uniform vec3 top,bot; out vec4 o; void main(){o=vec4(mix(bot,top,smoothstep(.3,1.,y)),1.);}`);

// ---------- meshes ----------

function boxM(){const Pp=[],U=[];const v=(x,y,z)=>[x-.5,y-.5,z-.5];
 quad(Pp,v(0,0,1),v(1,0,1),v(1,1,1),v(0,1,1),U);quad(Pp,v(1,0,0),v(0,0,0),v(0,1,0),v(1,1,0),U);quad(Pp,v(1,0,1),v(1,0,0),v(1,1,0),v(1,1,1),U);
 quad(Pp,v(0,0,0),v(0,0,1),v(0,1,1),v(0,1,0),U);quad(Pp,v(0,1,1),v(1,1,1),v(1,1,0),v(0,1,0),U);quad(Pp,v(0,0,0),v(1,0,0),v(1,0,1),v(0,0,1),U);return mk(Pp,U)}

function texFrom(src){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);const ext=gl.getExtension('EXT_texture_filter_anisotropic');if(ext)gl.texParameterf(gl.TEXTURE_2D,ext.TEXTURE_MAX_ANISOTROPY_EXT,4);return t}

const _nearPlace=nearPlace;nearPlace=function(){let best=null;

 for(const B of BALIHO){const p=balihoPos(B);const d=Math.hypot(p.x-PL1.x,p.z-PL1.z);if(d<6&&(!best||d<best.d))best={slot:B.slot,d}}
 if(!best){_nearPlace();return}const id='brand:'+best.slot,b=document.getElementById('wNear');
 if(id!==NEAR){NEAR=id;const bb=brandOf(best.slot);b.textContent=bb?'Lihat: '+String(bb.nama).slice(0,24):(best.slot.startsWith('warung')?(BR.open&&!BR.slot[best.slot]?'Lihat: Warung kosong':'Lihat: Warung (voting)'):'Lihat: Baliho');b.hidden=false}};

const _tap=tap;tap=function(x,y){if(VPm){const r=cv.getBoundingClientRect(),nx=((x-r.left)/r.width)*2-1,ny=1-((y-r.top)/r.height)*2,eye=VPm.eye,fwd=norm(sub(cam.tgt,eye)),right=norm(cross(fwd,[0,1,0])),upv=cross(right,fwd),th=Math.tan(cam.fov*Math.PI/360),asp=r.width/r.height;
  const dir=norm([fwd[0]+right[0]*nx*th*asp+upv[0]*ny*th,fwd[1]+right[1]*nx*th*asp+upv[1]*ny*th,fwd[2]+right[2]*nx*th*asp+upv[2]*ny*th]);
  for(const B of BALIHO){const p=balihoPos(B),oc=sub([p.x,6.6,p.z],eye),t=dot(oc,dir);if(t>0&&dot(oc,oc)-t*t<3.6*3.6){openBrand(B.slot);return}}}_tap(x,y)};
